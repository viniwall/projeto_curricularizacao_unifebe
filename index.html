<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Expedição Órbita Júnior: jogo educacional para a Pré-escola II (5 a 6 anos). Sons e sílabas, noções de espaço, números e cores.">
  <meta name="theme-color" content="#0A0E27">
  <title>Expedição Órbita Júnior</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/audio.js" defer></script>
  <script src="js/registro.js" defer></script>
  <script src="js/atividades.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="ceu" aria-hidden="true">
    <div class="estrelas e1"></div><div class="estrelas e2"></div><div class="estrelas e3"></div>
    <div id="decor-planeta" class="decor-planeta"></div>
  </div>

  <main id="app">

    <!-- INÍCIO -->
    <section id="tela-inicio" class="tela tela-centro" aria-labelledby="titulo-inicio">
      <div class="orbi orbi-grande acenando" data-orbi></div>
      <h1 id="titulo-inicio" tabindex="-1"><span class="titulo-linha">Expedição</span> <span class="titulo-destaque">Órbita</span> <span class="titulo-selo">Júnior</span></h1>
      <button id="btn-jogar" class="btn btn-primario btn-enorme" type="button" disabled>
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        Jogar
      </button>
      <p id="aviso-carregamento" class="aviso" role="status">Carregando…</p>

      <details class="adulto">
        <summary>Área do adulto</summary>
        <div class="adulto-conteudo">
          <label class="interruptor"><input id="opt-voz" type="checkbox" checked> <span>Órbi lê as perguntas sozinho</span></label>
          <label class="interruptor"><input id="opt-musica" type="checkbox" checked> <span>Música</span></label>
          <label class="interruptor"><input id="opt-som" type="checkbox" checked> <span>Efeitos sonoros</span></label>
          <div class="so-com-registro">
            <p id="registro-status" class="texto-adulto"></p>
            <button class="btn btn-secundario btn-exportar" type="button">Exportar registro (.txt)</button>
            <button id="btn-limpar" class="btn btn-secundario" type="button">Apagar registro</button>
          </div>
          <p class="texto-adulto">O nome digitado e o registro ficam só neste aparelho. Nada é enviado pela internet.</p>
        </div>
      </details>
    </section>

    <!-- NOME -->
    <section id="tela-nome" class="tela tela-centro" aria-labelledby="titulo-nome" hidden>
      <div class="cabecalho-nome">
        <div class="orbi orbi-medio" data-orbi></div>
        <h2 id="titulo-nome" tabindex="-1">Qual é o seu nome?</h2>
      </div>
      <form id="form-nome" class="form-nome" autocomplete="off">
        <label for="campo-nome" class="visualmente-oculto">Nome completo da criança</label>
        <input id="campo-nome" class="campo" type="text" maxlength="60" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Nome completo">
        <button id="btn-nome-ok" class="btn btn-primario btn-seta" type="submit" aria-label="Continuar">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z" fill="currentColor"/></svg>
        </button>
      </form>
      <div id="teclado" class="teclado" role="group" aria-label="Teclado"></div>
    </section>

    <!-- NAVE -->
    <section id="tela-nave" class="tela tela-centro" aria-labelledby="titulo-nave" hidden>
      <div class="orbi orbi-medio" data-orbi></div>
      <h2 id="titulo-nave" tabindex="-1">Escolha a sua nave</h2>
      <div id="cores-nave" class="cores-nave" role="radiogroup" aria-label="Cor da nave"></div>
      <button id="btn-nave-ok" class="btn btn-primario btn-enorme" type="button">
        Continuar
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z" fill="currentColor"/></svg>
      </button>
    </section>

    <!-- NÍVEL -->
    <section id="tela-nivel" class="tela tela-centro" aria-labelledby="titulo-nivel" hidden>
      <div class="orbi orbi-medio" data-orbi></div>
      <h2 id="titulo-nivel" tabindex="-1">Escolha o nível</h2>
      <div class="niveis">
        <button class="cartao-nivel" type="button" data-nivel="Fácil" style="--cor: var(--lima)">
          <span class="estrelas-nivel" aria-hidden="true"><img src="assets/img/estrela.svg" alt=""></span>
          <span class="nivel-nome">Fácil</span>
        </button>
        <button class="cartao-nivel" type="button" data-nivel="Médio" style="--cor: var(--ciano)">
          <span class="estrelas-nivel" aria-hidden="true"><img src="assets/img/estrela.svg" alt=""><img src="assets/img/estrela.svg" alt=""></span>
          <span class="nivel-nome">Médio</span>
        </button>
        <button class="cartao-nivel" type="button" data-nivel="Difícil" style="--cor: var(--rosa)">
          <span class="estrelas-nivel" aria-hidden="true"><img src="assets/img/estrela.svg" alt=""><img src="assets/img/estrela.svg" alt=""><img src="assets/img/estrela.svg" alt=""></span>
          <span class="nivel-nome">Difícil</span>
        </button>
      </div>
    </section>

    <!-- MAPA -->
    <section id="tela-mapa" class="tela tela-mapa" aria-labelledby="titulo-mapa" hidden>
      <header class="barra">
        <div class="piloto"><img id="mapa-nave" class="nave-piloto" src="assets/img/nave.svg" alt=""><span id="mapa-piloto"></span></div>
        <button id="btn-encerrar" class="btn-icone" type="button" aria-label="Parar e sair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z" fill="currentColor"/></svg>
        </button>
      </header>
      <h2 id="titulo-mapa" tabindex="-1" class="visualmente-oculto">Mapa dos planetas</h2>
      <button id="fala-mapa" class="fala" type="button" aria-label="Ouvir de novo">
        <span class="orbi orbi-pequeno" data-orbi></span>
        <span class="balao"><span class="balao-texto">Escolha um planeta!</span></span>
      </button>
      <div id="mapa" class="mapa"></div>
    </section>

    <!-- PERGUNTA -->
    <section id="tela-jogo" class="tela tela-jogo" aria-labelledby="enunciado" hidden>
      <header class="barra">
        <button id="btn-mapa" class="btn-icone" type="button" aria-label="Voltar ao mapa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z" fill="currentColor"/></svg>
        </button>
        <ol id="progresso" class="progresso" aria-label="Progresso"></ol>
        <button id="btn-ouvir" class="btn-icone btn-ouvir" type="button" aria-label="Ouvir de novo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
        </button>
      </header>
      <button id="fala-jogo" class="fala" type="button" aria-label="Ouvir de novo" data-foco>
        <span id="orbi-jogo" class="orbi orbi-pequeno" data-orbi></span>
        <span class="balao"><span id="enunciado" class="balao-texto"></span></span>
      </button>
      <p id="feedback" class="visualmente-oculto" role="status" aria-live="polite"></p>
      <div id="corpo" class="corpo">
        <div id="cena" class="cena" hidden></div>
        <div id="resposta" class="resposta"></div>
      </div>
    </section>

    <!-- PLANETA CONCLUÍDO -->
    <section id="tela-planeta" class="tela tela-centro" aria-labelledby="titulo-planeta" hidden>
      <img id="planeta-img" class="planeta-conquistado" src="assets/img/planeta-sons.svg" alt="">
      <h2 id="titulo-planeta" tabindex="-1">Planeta explorado!</h2>
      <div id="planeta-premios" class="premios" role="img"></div>
      <button id="btn-planeta-ok" class="btn btn-primario btn-enorme" type="button">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        Continuar
      </button>
    </section>

    <!-- FIM -->
    <section id="tela-fim" class="tela tela-centro" aria-labelledby="titulo-fim" hidden>
      <div id="orbi-fim" class="orbi orbi-medio" data-orbi></div>
      <h2 id="titulo-fim" tabindex="-1">Parabéns!</h2>
      <p id="mensagem-fim" class="mensagem-fim"></p>
      <div id="relatorio" class="relatorio"></div>
      <div class="botoes">
        <button id="btn-continuar" class="btn btn-primario" type="button" hidden>
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          Continuar
        </button>
        <button id="btn-de-novo" class="btn btn-verde" type="button">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor"/></svg>
          Jogar de novo
        </button>
        <button id="btn-trocar-nivel" class="btn btn-roxo" type="button">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="currentColor"/></svg>
          Trocar nível
        </button>
      </div>
      <div class="so-com-registro">
        <button class="btn btn-secundario btn-exportar" type="button">Exportar registro (.txt)</button>
      </div>
    </section>

  </main>
  <div id="efeitos" class="efeitos" aria-hidden="true"></div>
</body>
</html>
